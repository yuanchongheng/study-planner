name: Apply collapsible sidebar

on:
  push:
    branches: [main]
    paths:
      - 'scripts/sidebar-toggle.mjs'
      - '.github/workflows/sidebar-toggle.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply collapsible sidebar
        run: node scripts/sidebar-toggle.mjs
      - name: Validate JavaScript
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const h=fs.readFileSync('index.html','utf8');
          const scripts=[...h.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/g)].map(m=>m[1]);
          for (const s of scripts) if (s.trim()) new Function(s);
          console.log('JavaScript syntax OK');
          NODE
      - name: Commit updated page
        run: |
          if git diff --quiet -- index.html; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Add collapsible sidebar navigation'
          git push
