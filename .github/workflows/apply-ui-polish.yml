name: Apply UI polish

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-ui-polish.mjs'
      - '.github/workflows/apply-ui-polish.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply patch
        run: node scripts/apply-ui-polish.mjs
      - name: Validate JavaScript
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const h=fs.readFileSync('index.html','utf8');
          const m=h.match(/<script>\(\(\)=>\{'use strict';([\s\S]*?)\}\)\(\);\s*<\/script>/);
          if(!m) throw new Error('main script not found');
          new Function("'use strict';"+m[1]);
          console.log('JavaScript syntax OK');
          NODE
      - name: Commit updated page
        run: |
          if git diff --quiet -- index.html; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Polish UI and enlarge calendar time scale'
          git push
