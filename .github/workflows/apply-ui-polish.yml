name: Refresh planner entry

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-ui-polish.mjs'
      - '.github/workflows/apply-ui-polish.yml'
      - 'qoder-theme.css'
      - 'notion-sync-v2.js'
      - 'same-device-cloud-sync.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Patch homepage entry
        run: node scripts/apply-ui-polish.mjs
      - name: Verify planner entry
        run: |
          grep -F './notion-sync-v2.js?v=20261010-0560' index.html
          grep -F 'id="mainThemeBoot"' index.html
          grep -F 'id="mainThemeCss" rel="stylesheet" href="./qoder-theme.css?v=20261010-0560"' index.html
          grep -F "document.documentElement.classList.add('qoder-ui')" index.html
          grep -F "Math.max(Number(current?.revision||0)+1,Date.now())" index.html
          grep -F "最后修改已生效" index.html
          if grep -F "revision=eq.'+remoteRevision" index.html; then
            echo 'Old optimistic revision conflict filter is still present.'
            exit 1
          fi
          if grep -F "检测到多设备修改冲突" index.html; then
            echo 'Old multi-device conflict state is still present.'
            exit 1
          fi
          grep -F -- '--q-sidebar:#f1f5ef' qoder-theme.css
          grep -F "load('./same-device-cloud-sync.js')" notion-sync-v2.js
          grep -F 'navigator.locks.request(WEB_LOCK' same-device-cloud-sync.js
          grep -F 'function dragDayFromX(x)' google-calendar-planner-v3.js
          grep -F 'delete day.timeOverrides[key][id]' google-calendar-planner-v3.js
          if grep -F './calendar-drag-controller-v2.js' notion-sync-v2.js; then
            echo 'Conflicting drag controller is still loaded.'
            exit 1
          fi
          grep -F 'calendarBootStyle' index.html
      - name: Commit planner files
        run: |
          if git diff --quiet -- index.html; then
            echo 'No planner entry change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '4189822+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Publish last-write-wins cloud sync'
          git push
