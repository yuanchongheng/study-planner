name: Refresh planner entry

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-ui-polish.mjs'
      - '.github/workflows/apply-ui-polish.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Patch homepage entry
        run: node scripts/apply-ui-polish.mjs
      - name: Verify planner entry
        run: |
          grep -F './notion-sync-v2.js?v=20261006-0510' index.html
          grep -F "load('./same-device-cloud-sync.js')" notion-sync-v2.js
          grep -F 'navigator.locks.request(WEB_LOCK' same-device-cloud-sync.js
          grep -F 'localStorage.getItem(REV_KEY)' same-device-cloud-sync.js
          grep -F 'function dragDayFromX(x)' google-calendar-planner-v3.js
          grep -F "if(dragState&&dragState.moved)updateDrag(e)" google-calendar-planner-v3.js
          grep -F 'delete day.timeOverrides[key][id]' google-calendar-planner-v3.js
          grep -F 'gcal-event-goal' calendar-content-readonly.js
          grep -F 'data-panel-goal' calendar-drag-sidepanel.js
          if grep -F './calendar-drag-controller-v2.js' notion-sync-v2.js; then
            echo 'Conflicting drag controller is still loaded.'
            exit 1
          fi
          grep -F 'calendarBootStyle' index.html
      - name: Commit planner files
        run: |
          if git diff --quiet -- index.html; then
            echo 'No planner entry change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '4189822+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Publish same-device cloud sync coordinator'
          git push
