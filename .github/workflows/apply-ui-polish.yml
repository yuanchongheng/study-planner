name: Refresh planner entry

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-ui-polish.mjs'
      - '.github/workflows/apply-ui-polish.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Patch homepage entry
        run: node scripts/apply-ui-polish.mjs
      - name: Verify planner entry
        run: |
          grep -F './notion-sync-v2.js?v=20261004-0290' index.html
      - name: Commit homepage entry
        run: |
          if git diff --quiet -- index.html; then
            echo 'No homepage change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Refresh planner script entry'
          git push
