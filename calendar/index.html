<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>五日日历｜备考计划室</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif}
    .calendar-shell{position:relative;width:100%;height:100%;overflow:hidden}
    iframe{display:block;width:100%;height:100%;border:0;background:#fff}
    .home-link{position:fixed;right:18px;bottom:18px;z-index:20;display:inline-flex;align-items:center;gap:7px;padding:10px 14px;border:1px solid #dadce0;border-radius:999px;background:rgba(255,255,255,.94);box-shadow:0 4px 14px rgba(60,64,67,.18);color:#3c4043;text-decoration:none;font-size:12px;font-weight:750;backdrop-filter:blur(10px)}
    .home-link:hover{background:#f8f9fa}
    @media(max-width:730px){.home-link{right:12px;bottom:12px;padding:9px 12px;font-size:11px}}
  </style>
</head>
<body>
  <div class="calendar-shell">
    <iframe src="../?calendar=1" title="五日日历" loading="eager"></iframe>
    <a class="home-link" href="../" target="_top">← 返回主站</a>
  </div>
</body>
</html>
