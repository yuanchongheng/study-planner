<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#17181b">
  <title>正在打开完整日历…</title>
  <meta http-equiv="refresh" content="0; url=../?calendar=1">
  <style>
    html,body{margin:0;width:100%;height:100%;background:#17181b;color:#9aa0a6;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif}
    body{display:grid;place-items:center;overflow:hidden}
    .boot{display:flex;align-items:center;gap:10px;font-size:12px;opacity:.85}
    .dot{width:8px;height:8px;border-radius:50%;background:#7066df;box-shadow:0 0 0 5px rgba(112,102,223,.14);animation:pulse .8s ease-in-out infinite alternate}
    a{color:#aaa3fc;font-weight:700}
    @keyframes pulse{to{transform:scale(.7);opacity:.55}}
  </style>
  <script>location.replace('../?calendar=1');</script>
</head>
<body>
  <div class="boot"><span class="dot"></span><span>正在打开完整日历…</span></div>
  <noscript>如果没有自动跳转，<a href="../?calendar=1">点这里打开</a>。</noscript>
</body>
</html>
